<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Random Music JS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      name="description"
      content="Discover our random electronic music generating app powered by chaos. Simply click the PLAY button and let our random rhythmic signature, which varies between 3 and 4, transport you. The drum set is randomly generated from a sample library, while a synthesizer handles the bass, another handles the chords, and two more handle the melody. New melodic and rhythmic parts are generated every 8 measures. We use JavaScript's Web Audio API to create this immersive and unique musical experience. Try it out now!"
    />
    <meta property="og:title" content="Random Music JS" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://random-music-js.inner-most.fr/logo.png"
    />
    <meta
      property="og:description"
      content="Discover our random electronic music generating app powered by chaos. Simply click the PLAY button and let our random rhythmic signature, which varies between 3 and 4, transport you. The drum set is randomly generated from a sample library, while a synthesizer handles the bass, another handles the chords, and two more handle the melody. New melodic and rhythmic parts are generated every 8 measures. We use JavaScript's Web Audio API to create this immersive and unique musical experience. Try it out now!"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rowdies&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="title">
        <h1>Random Music JS</h1>
        <div class="view-controls">
          <div id="currentStep"></div>
          <div id="currentMeasure"></div>
          <div id="currentSong"></div>
          <div id="currentSongDuration"></div>
          <div id="currentScale"></div>
        </div>
      </div>
      <canvas id="canva" width="600" height="220"></canvas>
    </main>
    <div class="controls">
      <select name="songs" id="songChoice">
        <option value="0">Eight Bits</option>
        <option value="1">Sine</option>
      </select>
      <button id="play">Play</button>
      <button id="stop">Stop</button>
    </div>
    <script src="Timer.js" type="module"></script>
    <script src="notes.js" type="module"></script>
    <script src="utils.js" type="module"></script>
    <script src="Mode.js" type="module"></script>
    <script src="Enveloppe.js" type="module"></script>
    <script src="Synth.js" type="module"></script>
    <script src="draw.js" type="module"></script>
    <script src="sine.js" type="module"></script>
    <script src="heightBits.js" type="module"></script>
    <script src="script.js" type="module"></script>
  </body>
</html>
